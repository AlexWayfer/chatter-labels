<template id="labels-control">
	<div class="chatter-labels-control">
		<button type="button" title="Edit labels">
			<span class="chatter-labels-summary"></span>
			<svg class="chatter-labels-edit" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
				<path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM5.92 19H5v-.92l9.06-9.06.92.92L5.92 19zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path>
			</svg>
		</button>
	</div>
</template>

<template id="labels-popup">
	<div class="chatter-labels-popup" popover="auto" role="dialog">
		<button type="button" class="chatter-labels-close" aria-label="Close labels" popovertargetaction="hide">×</button>
	</div>
</template>

<template id="label-summary">
	<span><img alt="" /><span class="name"></span></span>
</template>
