<!DOCTYPE html>
<html>
	<head>
		<title>Chatter Labels Options</title>

		<meta charset="utf-8">

		<link rel="stylesheet" href="../styles/options.css" />

		<script type="text/javascript" src="../scripts/options.js" charset="UTF-8"></script>
	</head>
	<body>
		<h1>Chatter Labels Options</h1>

		<form name="labels">
			<template id="label">
				<fieldset>
					<div class="left-part">
						<label>
							Letter:
							<input
								type="text"
								name="letter"
								minlength="1"
								maxlength="1"
								required
							/>
						</label>

						<label>
							Name:
							<input
								type="text"
								name="name"
								required
							/>
						</label>
					</div>

					<div class="right-part">
						<button
							type="button"
							name="delete"
						><div class="icon"></div></button>
					</div>
				</fieldset>
			</template>

			<button type="button" name="add">Add</button>
			<button type="submit">Save</button>
		</form>
	</body>
</html>
