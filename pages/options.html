<!DOCTYPE html>
<html>
	<head>
		<title>Chatter Labels Options</title>

		<meta charset="utf-8">

		<link rel="stylesheet" href="../styles/options.css" />

		<script type="module" src="../scripts/options/page.js"></script>
	</head>
	<body>
		<h1>Chatter Labels Options</h1>

		<h2>Storage</h2>

		<h3>GitHub Gist</h3>

		<form name="github-gist">
			<p>
				<a
					class="create-token"
					href="https://github.com/settings/personal-access-tokens/new"
					target="_blank"
				>
					Create token
				</a>
				(select "Gists" in Permissions for Account)
			</p>

			Token: <input type="password" name="token" required />

			<button type="button" class="token-visibility-toggle">
				<span class="text-show">Show</span>
				<span class="text-hide">Hide</span>
			</button>

			<button type="submit">Save</button>

			<span class="toast saved" hidden>Saved!</span>
			<span class="toast error" hidden></span>

			<p class="existing-gist" hidden>
				<a target="_blank">GitHub Gist</a>
			</p>
		</form>

		<h2>Labels</h2>

		<div class="labels">
			<template id="label">
				<fieldset>
					<div class="move">
						<button type="button" class="up"><div class="icon"></div></button>
						<button type="button" class="down"><div class="icon"></div></button>
					</div>

					<div class="content">
						<div class="label">
							<div class="fields">
								<input type="hidden" name="id" form="labels-form" />

								<label>
									Icon:
									<img class="icon-preview" alt="" />
									<input type="hidden" name="icon" form="labels-form" />
									<input type="file" class="icon" form="labels-form" accept="image/*" required />
								</label>

								<label>
									Name:
									<input
										type="text"
										name="name"
										form="labels-form"
										required
										autocomplete="off"
									/>
								</label>
							</div>
						</div>

						<div class="assignments">
							<h4>Assignments:</h4>

							<template id="assignment">
								<li>
									<button type="button" class="delete-assignment invisible"><div class="icon"></div></button>
									<span class="username"></span> <span class="assigned-at"></span>
								</li>
							</template>

							<ul>
							</ul>

							<button type="button" class="toggle-add-assignments">Add</button>
							<button type="button" class="toggle-remove-assignments">Remove</button>
							<form class="add-assignments" hidden>
								<textarea
									rows="3"
									placeholder="One nickname per line"
								></textarea>
								<button type="submit">Save</button>
								<span class="toast added" hidden>Added!</span>
								<span class="toast error" hidden></span>
							</form>
						</div>
					</div>

					<div class="buttons">
						<button type="button" class="delete"><div class="icon"></div></button>
					</div>
				</fieldset>
			</template>

			<div class="fieldsets">
			</div>

			<p class="empty-list-notice">List is empty.</p>

			<form name="labels" id="labels-form">
				<button type="button" class="add">Add</button>
				<button type="submit">Save</button>
				<span class="toast saved" hidden>Saved!</span>
				<span class="toast error" hidden></span>
			</form>
		</div>
	</body>
</html>
