<!DOCTYPE html>
<html>
	<head>
		<title>Chatter Labels Options</title>

		<meta charset="utf-8">

		<link rel="stylesheet" href="../styles/options.css" />

		<script type="module" src="../scripts/options/page.js"></script>
	</head>
	<body>
		<h1>Chatter Labels Options</h1>

		<h2>Labels</h2>

		<form name="labels">
			<template id="label">
				<fieldset>
					<div class="label">
						<div class="fields">
							<input type="hidden" name="id" />

							<label>
								Letter:
								<input
									type="text"
									name="letter"
									minlength="1"
									maxlength="1"
									required
								/>
							</label>

							<label>
								Name:
								<input
									type="text"
									name="name"
									required
									autocomplete="off"
								/>
							</label>
						</div>

						<div class="buttons">
							<button
								type="button"
								class="delete"
							><div class="icon"></div></button>
						</div>
					</div>

					<template id="assignment">
						<li>
							<span class="username"></span> <span class="assigned-at"></span>
						</li>
					</template>

					<ul class="assignments">
					</ul>
				</fieldset>
			</template>

			<div class="fieldsets">
			</div>

			<p class="empty-list-notice">List is empty.</p>

			<button type="button" class="add">Add</button>
			<button type="submit">Save</button>
			<span class="toast-saved hidden">Saved!</span>
		</form>
	</body>
</html>
