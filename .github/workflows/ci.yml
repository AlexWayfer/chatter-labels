name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - lint:docs
          - lint:styles
          - lint:scripts
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - run: pnpm run ${{ matrix.script }}
